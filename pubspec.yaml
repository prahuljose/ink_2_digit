name: ink_2_digit
description: "A MNIST digit recognizer Flutter project."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_tflite: ^1.0.1
  image: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.11.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/mnist_model.tflite
    - assets/labels.txt
    - assets/icon/app_icon.png
    - assets/icon/splash_icon.png

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
